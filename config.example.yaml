# Example configuration for street-viewer-360.
# All values can be overridden by matching CLI options.

default_zoom: 13
output_dir: "./dist"
recursive: true
overwrite: false
device: "auto"  # auto | cpu | cuda | mps

anonymization:
  # Master switch. Set to false to skip detection and blurring entirely.
  enabled: true

  # Detector backend. Only "yolov8" is supported at the moment.
  detector: "yolov8"

  # Run `street-viewer-360 download-models --target ./models` first,
  # then point these to the downloaded .pt files. If either is omitted,
  # that category is skipped (e.g. drop plate_model_path on indoor sets).
  # face_model_path: ./models/yolov8n-face.pt
  # plate_model_path: ./models/yolov11n-license-plate.pt

  # Minimum detector confidence to keep a box. Most important knob for the
  # false-positive / false-negative tradeoff.
  #   - Too many false positives (random textures, foliage, signs blurred):
  #     raise toward 0.40-0.55.
  #   - Missing real faces/plates (e.g. small, partially occluded, or
  #     off-angle): lower toward 0.15-0.20.
  # Used as the default for both detectors. To tune face and plate
  # independently (typical when one model is noisier than the other), set
  # one or both of the per-detector overrides below. When unset (null),
  # the detector falls back to this default.
  confidence_threshold: 0.35

  # Per-detector overrides. Common pattern: a higher threshold for plates
  # (their text gives strong, distinctive signals -- few false positives at
  # 0.45+) and a lower threshold for faces (more recall needed at distance,
  # tolerable false-positive cost on building textures).
  # face_confidence_threshold: 0.30
  # plate_confidence_threshold: 0.45

  # Gaussian blur strength applied inside each detection box. Higher = more
  # privacy at the cost of obvious smudges.
  #   - Faces are recognizable: raise to 20-30.
  #   - Blur is too heavy / aesthetic complaints: lower to 8-12.
  # Kernel size is derived automatically (~4 * sigma, rounded to odd).
  blur_sigma: 15

  # Fraction by which each detected box is expanded before blurring (0.1 =
  # +10% on each side). Adds a safety margin so the blur covers a bit past
  # the detector's tight box (hair, jaw, plate frame, motion blur).
  #   - Edges of faces/plates still visible at box border: raise to 0.15-0.25.
  #   - Too much surrounding scenery blurred: lower to 0.0-0.05.
  expand_box_ratio: 0.1

  # Image size passed to the YOLO predict() call. Larger = better recall on
  # small/distant objects, slower inference, more VRAM. Should match or
  # exceed tile_size when tiling is active.
  #   - Missing small/far faces or plates: try 1536 or 1920.
  #   - Inference is slow or runs out of memory: drop to 960 or 832.
  inference_imgsz: 1280

  # Tile size in pixels for sliding-window inference on high-resolution
  # panoramas. Set to 0 to disable tiling and run the whole image at once.
  # Tiling massively improves recall on 360° images where faces/plates are
  # tiny relative to the full frame.
  #   - Panoramas are huge (e.g. 8K+) and small objects still missed: keep
  #     this at 1280 and increase inference_imgsz to match.
  #   - Inputs are already small (<= 2K wide): set to 0 to skip tiling.
  tile_size: 1280

  # Overlap between adjacent tiles in pixels. Prevents objects on tile
  # boundaries from being split and missed.
  #   - Objects near tile seams are missed or partially blurred: raise to
  #     384-512 (always keep < tile_size / 2).
  #   - Inference too slow due to many overlapping tiles: lower to 128.
  tile_overlap: 256

  # IoU threshold for non-maximum suppression. Detections of the same label
  # whose overlap exceeds this against a higher-confidence box are dropped.
  #   - Same face/plate gets blurred twice with slightly different boxes
  #     (often a tiling artifact): lower to 0.30-0.40.
  #   - Two genuinely adjacent objects (e.g. two faces close together) get
  #     merged into one: raise to 0.55-0.65.
  nms_iou_threshold: 0.45

horizon:
  # Equirectangular panoramas captured with a hand-held / vehicle-mounted 360
  # camera are rarely perfectly level. GoPro MAX 2 (and similar) writes the
  # capture orientation into XMP GPano PoseHeading/Pitch/RollDegrees. When we
  # have those, we can rotate the panorama so the horizon is level.
  #
  # Modes:
  #   auto   - rotate when |max(pose angles)| >= min_angle_degrees
  #   always - rotate whenever any pose data (or manual offsets) is present
  #   never  - do not rotate
  mode: auto

  # Threshold for "auto" mode. Below this all-pose-angles are treated as noise
  # and the image is passed through untouched (saves CPU and a tiny amount of
  # resampling loss). 0.2 is conservative; raise to 1.0 if you want only
  # noticeable tilts corrected.
  min_angle_degrees: 0.2

  # Resampling kernel. bilinear is fast and visually indistinguishable from
  # bicubic on photographic content; nearest is only useful for debug.
  interpolation: bilinear  # nearest | bilinear | bicubic

  # Manual offsets in degrees, added to the values read from XMP. Use these
  # for cameras that don't write Pose tags, or to nudge a known systematic
  # mount offset. Combine with override_metadata: true to ignore XMP entirely.
  pitch_offset_degrees: 0.0
  roll_offset_degrees: 0.0
  heading_offset_degrees: 0.0
  override_metadata: false

output:
  # Output image format and quality.
  #   webp - ~40-60% smaller than JPEG at visually equivalent quality. Default.
  #   jpeg - maximum compatibility. Pannellum, browsers, and image viewers all
  #          read it without question.
  format: webp
  quality: 90

  # Carry EXIF + XMP from the source to the output (GPS, camera model, GPano).
  # When horizon correction is applied, the GPano Pose angles in the output
  # are reset to 0.0 so downstream viewers don't try to re-rotate.
  preserve_metadata: true

metadata:
  include_without_gps: false
  timezone: "local"

# Map polyline is broken between consecutive panoramas when either threshold
# is exceeded. Time gap is ignored when one of the panoramas has no timestamp.
path:
  max_gap_meters: 50.0
  max_gap_seconds: 10.0

# Panorama viewer zoom limits, in degrees of horizontal field of view.
# Smaller min_hfov = tighter zoom-in. Pannellum's own default is 50; we use
# 30 so users can read distant signage. Going below ~10 starts to look
# perspective-distorted on equirectangular sources. max_hfov caps the
# zoom-out (above ~120 the fisheye distortion gets uncomfortable).
viewer:
  min_hfov: 30.0
  max_hfov: 120.0

map_layers:
  - name: "OpenStreetMap"
    url: "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png"
    attribution: "(c) OpenStreetMap contributors"
    default: true
  - name: "Satellite"
    url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"
    attribution: "Tiles (c) Esri"
    default: false
