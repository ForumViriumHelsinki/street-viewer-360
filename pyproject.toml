[project]
name = "street-viewer-360"
version = "0.1.0"
description = "Local CLI that processes 360 panoramas into a static web package with map + viewer."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Street Viewer 360 contributors" }]
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "pillow>=10.4",
    "exifread>=3.0",
    "jinja2>=3.1",
    "pydantic>=2.7",
]

[project.optional-dependencies]
anonymization = [
    "ultralytics>=8.3",
    "opencv-python>=4.10",
    "torch>=2.4",
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.scripts]
street-viewer-360 = "street_viewer_360.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/street_viewer_360"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "types-pyyaml>=6.0",
    "piexif>=1.1.3",
]

[tool.ruff]
line-length = 119
target-version = "py313"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "SIM", "RUF", "N", "PTH", "ANN", "PT"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN001", "ANN201", "ANN202"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
